<div class="page">
  <header class="topbar">
    <h1>{{ 'nav.profile' | translate }}</h1>
  </header>

  @if (profile(); as p) {
    <!-- Edit card -->
    <div class="card">
      <label>
        {{ 'auth.name' | translate }}
        <input [ngModel]="displayName()" (ngModelChange)="displayName.set($event)" type="text" />
      </label>

      <label>
        {{ 'profile.language' | translate }}
        <select [ngModel]="language()" (ngModelChange)="onLanguageChange($event)">
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="uk">Українська</option>
        </select>
      </label>

      <label>
        {{ 'profile.color' | translate }}
        <div class="palette">
          @for (c of palette; track c) {
            <button
              type="button"
              class="swatch"
              [class.active]="color() === c"
              [style.background]="c"
              (click)="selectColor(c)"
              [attr.aria-label]="c"
            ></button>
          }
        </div>
      </label>

      <div class="family-row">
        <span class="fam-label">{{ 'profile.family' | translate }}</span>
        <span class="fam-id">{{ p.familyId }}</span>
      </div>

      <button (click)="save()" [disabled]="saving()">
        {{ 'profile.save' | translate }}
      </button>

      @if (saved()) {
        <p class="saved-msg">{{ 'profile.saved' | translate }}</p>
      }
    </div>

    <button class="logout" (click)="logout()">{{ 'auth.logout' | translate }}</button>
  }
</div>
